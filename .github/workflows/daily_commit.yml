name: Daily Commit

on:
  schedule:
    - cron: '0 10 * * *'  # runs every day at 10:00 AM UTC
  workflow_dispatch:

jobs:
  commit-one-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Touch one file and commit
        run: |
          FILE=$(grep -v '^\s*$' pending.txt | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No pending files. Nothing to commit."
            exit 0
          fi

          sed -i 's/[[:space:]]*$//' "$FILE"
          sed -i -e '$a\' "$FILE"

          grep -v "^${FILE}$" pending.txt > pending.tmp && mv pending.tmp pending.txt

          echo "| $(date '+%Y-%m-%d') | \`$FILE\` |" >> COMMIT_LOG.md

          git config user.name "ashuasus"
          git config user.email "abhinav.singh1911@gmail.com"

          git add "$FILE" pending.txt COMMIT_LOG.md
          git commit -m "cleanup: trailing whitespace in $(basename $FILE)"
          git push
