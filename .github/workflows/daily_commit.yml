name: Daily Commit

on:
  schedule:
    - cron: '0 10 * * *'  # runs every day at 10:00 AM UTC
  workflow_dispatch: # also allows manual trigger

jobs:
  commit-one-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Touch one file and commit
        run: |
          FILE=$(grep -v '^\s*$' pending.txt | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No pending files. Nothing to commit."
            exit 0
          fi

          # Strip trailing whitespace from each line (valid linting cleanup)
          sed -i 's/[[:space:]]*$//' "$FILE"

          # Ensure file ends with a single newline
          sed -i -e '$a\' "$FILE"

          # Remove FILE from pending.txt
          grep -v "^${FILE}$" pending.txt > pending.tmp && mv pending.tmp pending.txt

          # Log to COMMIT_LOG.md
          echo "| $(date '+%Y-%m-%d') | \`$FILE\` |" >> COMMIT_LOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$FILE" pending.txt COMMIT_LOG.md
          git commit -m "cleanup: trailing whitespace in $(basename $FILE)"
          git push
