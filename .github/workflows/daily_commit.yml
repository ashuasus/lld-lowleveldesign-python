name: Daily Commit

on:
  schedule:
    - cron: "0 10 * * *"  # runs every day at 10:00 AM UTC
  workflow_dispatch:

jobs:
  commit-one-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Touch files and commit
        run: |
          COUNT=$(shuf -i 1-3 -n 1)
          echo "Committing $COUNT file(s) today"

          COMMITTED=0
          FILES_TO_ADD=""

          for i in $(seq 1 $COUNT); do
            FILE=$(grep -v '^\s*$' pending.txt | head -n 1)

            if [ -z "$FILE" ]; then
              echo "No more pending files."
              break
            fi

            sed -i 's/[[:space:]]*$//' "$FILE"
            sed -i -e '$a\' "$FILE"

            grep -v "^${FILE}$" pending.txt > pending.tmp && mv pending.tmp pending.txt

            echo "| $(date '+%Y-%m-%d') | \`$FILE\` |" >> COMMIT_LOG.md

            FILES_TO_ADD="$FILES_TO_ADD $FILE"
            COMMITTED=$((COMMITTED + 1))
          done

          if [ $COMMITTED -eq 0 ]; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "ashuasus"
          git config user.email "abhinav.singh1911@gmail.com"

          git add $FILES_TO_ADD pending.txt COMMIT_LOG.md
          git commit -m "cleanup: trailing whitespace in $COMMITTED file(s)"
          git push
